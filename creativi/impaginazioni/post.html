<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Post Pane Quotidiano</title>
<link rel="stylesheet" href="common.css">
<style>
body{width:1080px;height:1350px;position:relative}
.k{position:absolute;left:72px;top:92px;font:800 24px Inter;letter-spacing:4px;color:var(--terra)}
h1{position:absolute;left:66px;top:150px;font:900 104px Fraunces;line-height:1;letter-spacing:-2.5px;color:var(--ink)}
h1 em{display:block;margin-top:18px;font-style:italic;color:var(--terra)}
.steps{position:absolute;left:72px;top:610px;display:flex;flex-direction:column;gap:26px}
.st{display:flex;align-items:center;gap:22px;font:700 36px Inter;color:var(--ink)}
.st i{font-style:normal;width:66px;height:66px;border-radius:50%;background:var(--senape);display:flex;align-items:center;justify-content:center;font:900 38px Fraunces}
.cons{position:absolute;left:72px;top:900px;background:#fff;border-radius:28px;padding:22px 32px;box-shadow:0 12px 30px rgba(44,42,40,.12);border:3px solid var(--terra)}
.cons b{display:block;font:900 52px Fraunces;color:var(--terra);line-height:1}
.cons span{display:block;font:500 25px Inter;color:#6b645d;margin-top:8px}
#ph{left:650px;top:520px;transform:rotate(6deg) scale(.8);transform-origin:0 0}
.band{position:absolute;left:0;right:0;bottom:0;height:200px;background:var(--panna);border-top:6px solid var(--terra);
  display:flex;align-items:center;justify-content:center;box-shadow:0 -18px 40px rgba(44,42,40,.10)}
.band .wordmark{font-size:76px}.band .tagline{font-size:30px}.band .handle{font-size:24px}
</style></head><body><div class="carta"></div>
<div class="phone" id="ph"><div class="screen"><div class="island"></div>
  <div class="status"><span>9:41</span><span>●●● ▮</span></div>
  <div class="vp"><img src="assets/negozio.png" style="transform:translateY(-1146px)"></div>
  <img class="nav" src="assets/nav.png"></div></div>
<div class="k">PANE QUOTIDIANO · VIA CALZOLAI 25</div>
<h1>Non riesci<br>a passare?<em>Passiamo noi.</em></h1>
<div class="steps">
  <div class="st"><i>1</i>Scegli dal telefono</div>
  <div class="st"><i>2</i>Scegli l'ora</div>
  <div class="st"><i>3</i>Paghi alla consegna</div>
</div>
<div class="cons"><b>Consegna 3 €</b><span>4 € se spendi meno di 10 €</span></div>
<div class="band"><div class="firma"><div class="wordmark"><span class="my">My</span><span class="city">City</span></div>
  <div class="tagline">La spesa che tiene viva la città.</div><div class="handle">@mycity.piacenza</div></div></div>
</body></html>
