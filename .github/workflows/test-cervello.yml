# 🧪 I TEST DEL CERVELLO, ESEGUITI DA QUALCUNO CHE NON È IL GIRO — AR-377 (lotto 33).
#
# PERCHÉ ESISTE. La suite `cervello/test-cervello.mjs` è buona e gira a ogni giro come vincolo hard.
# Il problema non era la suite: era il suo UNICO esecutore. Ogni difesa appesa al giro eredita
# l'uptime del giro — e il giro è il pezzo che si ferma per primo. Il 29/7 il VPS è stato fermo
# quaranta ore: in quelle quaranta ore un test rosso non ha fermato niente, perché nessuno lo ha
# eseguito. Non era rotto: non c'era.
#
# LA RADICE: la verifica era agganciata a un PROCESSO invece che al MOMENTO in cui il codice cambia.
# Qui si aggancia al momento.
#
# COSA COPRE, e cosa copriva già. `cancello-lotto.yml` gira sulle `pull_request` e dentro il cancello
# la suite c'è: quella strada era già protetta. La strada scoperta è l'altra, ed è quella che questa
# macchina usa tutti i giorni — il **push diretto su main** dal VPS (ramo unico, `memoria.ramo`).
# Un fix di codice che arriva da lì non incontrava nessuna prova, mai. Questo workflow è per quella.
#
# COSA NON FA. Non mergia, non pubblica, non tocca il VPS: legge, esegue, e dice sì o no. Perché un
# rosso qui IMPEDISCA il merge serve la protezione del ramo su GitHub — che è nelle impostazioni del
# repository, cioè di Nicola: è scritto nella lettera del lotto, non dato per fatto.
#
# La regola generale, da tenere: **nessuna difesa può avere come unico esecutore un processo che può
# stare fermo giorni senza che nessuno se ne accorga.** Il giro resta la seconda rete, non la prima.

# 🍰 IN FETTE, DAL 13/11 — e SOLO SU MAIN. Prima girava anche su ogni richiesta, e lì rifaceva da
# capo la stessa suite che il cancello del lotto aveva appena fatto: dieci minuti di runner per lo
# stesso verdetto due volte. Sulle richieste il suo verdetto — stesso nome, «suite del cervello +
# typecheck del Pannello», stesso significato: ogni rosso è rosso, nessun tetto — lo dà adesso
# `cancello-lotto.yml`, leggendo le fette che il cancello fa girare comunque. Qui resta la strada
# per cui questo file è nato (AR-377): il push diretto su main, che nessun altro controlla.
# Le fette sono le stesse del cancello (cervello/fette-ci.mjs): ogni prova gira una volta, su una
# fetta; chi ricuce conta che non ne manchi nessuna, e una fetta che non consegna esce ⚪ → rosso.

name: Test del cervello

on:
  push:
    # 🍰 SOLO SU MAIN (13/11). Prima partiva anche a ogni push sul ramo di una richiesta, dove il
    # cancello del lotto fa già girare la stessa suite: due volte lo stesso lavoro, e il conto è
    # misurato — sulla richiesta 948 i due flussi insieme chiedevano 23 macchine contro le circa 20
    # che l'account ne concede, e una fetta del cancello è rimasta in coda 73 secondi. Questo file
    # esiste per il push diretto su main (AR-377): lì resta, identico.
    branches: [main]
    # Solo quando cambia CODICE. La memoria (vault, briefing, quaderni) arriva su main decine di
    # volte al giorno dal worker: farci girare la suite non proverebbe niente e insegnerebbe a
    # ignorare le notifiche — un allarme che si impara a scorrere costa quanto uno spento.
    paths:
      - "cervello/**"
      - "pannello/**"
      - ".claude/**"
      - ".github/workflows/**"
  workflow_dispatch: {}

concurrency:
  group: test-cervello-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Quante fette: l'elenco qui sotto è l'UNICO posto dove si sceglie — il comando legge indice e
  # totale dalla matrice stessa, così un numero scritto due volte non può lasciare fuori una fetta.
  suite:
    name: suite del cervello — fetta ${{ matrix.fetta }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fetta: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # Agganciate al commit, non all'etichetta (AR-637): un tag si sposta, un commit no.
      # Per aggiornarle: `git ls-remote --tags https://github.com/actions/checkout v4`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # LA STORIA SERVE, e il motivo è già scritto in cancello-lotto.yml: alcuni controlli del
          # cervello chiedono a git cosa è cambiato negli ultimi giorni (la quota di sforzo
          # macchina-vs-business, per dirne uno). Con il clone superficiale che actions/checkout fa
          # per default, `git log --since` non sa datare i commit tronchi e restituisce tutto il
          # raggiungibile: la misura esce sbagliata e il test rosso.
          #
          # Alla prima corsa questo workflow è fallito esattamente così — avevo copiato la forma del
          # workflow accanto senza portarmi dietro la riga che ne spiegava il perché. È la malattia
          # del lotto 33 vista da vicino: una condizione dedotta dall'esempio invece che capita.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          # La cache dei pacchetti scaricati: `npm ci` gira lo stesso e installa esattamente il
          # lockfile — cambia solo che non riscarica tutto da internet a ogni fetta.
          cache: npm
          cache-dependency-path: pannello/package-lock.json

      # Le dipendenze servono al typecheck: senza, `tsc` non parte e il passo uscirebbe cieco.
      # Cieco non è verde — è la regola che questa macchina applica a ogni guardiano (AR-322), e
      # vale anche qui: un passo saltato non va raccontato come un passo superato.
      #
      # AR-696 — questo passo stava DOPO la suite, e la conseguenza non era il typecheck: erano tre
      # schede CHIUSE che a ogni corsa risultavano «prova rossa adesso». La loro prova importa una
      # rotta del Pannello, che importa `next`, che qui non era ancora installato: la prova non
      # partiva e il banco chiamava rosso un fix che non era mai tornato indietro.
      #
      # Spostarlo prima non è cosmetica: quella prova adesso viene MISURATA invece che dichiarata
      # non misurata. Fra le due c'è la differenza che questo repo passa il tempo a difendere — e la
      # copertura si guadagna installando lo strumento, non abbassando l'asticella.
      #
      # ⚖️ DUE SESSIONI HANNO TROVATO QUESTO STESSO DIFETTO NELLA STESSA NOTTE, ognuna per la sua
      # strada, e qui sotto c'è anche il racconto dell'altra. Non l'ho tolto: due descrizioni
      # indipendenti dello stesso guasto valgono più di una, e la seconda porta un dettaglio che la
      # prima non ha — i due workflow che davano verdetti opposti sulla stessa riga di codice.
      #
      # E servono PRIMA della suite, non solo al typecheck. Il 14/8 questo passo stava sotto, e
      # `c1-atto-una-volta-sola.test.mjs` usciva 🚫 «import non risolvibile»: quel test carica
      # `pannello/src/app/api/azioni-pronte/route.ts`, che importa `next`, che senza `npm ci` non
      # esiste. Una prova sana veniva contata come rotta perché nessuno aveva ancora installato ciò
      # che le serve — e il cancello del lotto, che le dipendenze le installa per primo, restava
      # verde sulla stessa riga di codice. Due workflow con lo stesso compito e due verdetti opposti:
      # il rosso non stava nel codice, stava nell'ordine dei passi.
      # 🐚 CHI ESEGUE LE PROVE IN BASH — AR-693 ①. Ventinove prove esistevano e non le lanciava
      # nessuno: senza `bats` il banco le dichiara ⚪ e il verde di fianco vale meno di quanto sembra.
      # Una casa sola per tutti gli esecutori (CI, VPS, avvio di sessione): cervello/installa-bats.sh.
      # Sta PRIMA delle dipendenze del Pannello e non in mezzo: AR-697 pretende che quel passo e
      # «Test del cervello» restino adiacenti, e la sua mutazione li cerca attaccati.
      - name: Chi esegue le prove in bash
        run: bash cervello/installa-bats.sh

      - name: Dipendenze del Pannello
        run: npm --prefix pannello ci

      - name: Test del cervello
        run: node cervello/test-cervello.mjs --fetta "$((INDICE + 1))/$TOTALE" --referto "$RUNNER_TEMP/referti/suite-$((INDICE + 1)).json"
        env:
          INDICE: ${{ strategy.job-index }}
          TOTALE: ${{ strategy.job-total }}

      # Anche se la fetta è rossa: senza il referto chi ricuce non avrebbe niente da leggere, e un
      # rosso diventerebbe un ⚪ senza nome.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: suite-${{ matrix.fetta }}
          path: ${{ runner.temp }}/referti/
          if-no-files-found: warn
          retention-days: 3

  # Il verdetto della suite INTERA, con lo stesso nome di sempre: se la protezione del ramo lo
  # pretende, lo pretende per nome. Gira anche se una fetta è rossa: il verdetto è il suo.
  test:
    name: suite del cervello + typecheck del Pannello
    needs: [suite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pannello/package-lock.json

      - name: Dipendenze del Pannello per il typecheck
        run: npm --prefix pannello ci

      # Se una fetta non ha caricato niente, lo scaricamento non deve fermarsi prima che la
      # ricucitura possa nominarla: è lei che esce ⚪ e dice quale.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: suite-*
          merge-multiple: true
          path: ${{ runner.temp }}/referti/suite

      - name: Suite del cervello, ricucita dalle fette
        run: node cervello/test-cervello.mjs --ricuci "$RUNNER_TEMP/referti/suite"

      - name: Typecheck del Pannello
        if: ${{ !cancelled() }}
        run: npx --prefix pannello tsc --noEmit --project pannello/tsconfig.json
