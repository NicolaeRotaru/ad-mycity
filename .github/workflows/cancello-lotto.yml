# 🚧 IL CANCELLO SULLE PULL REQUEST — AR-346.
#
# PERCHÉ ESISTE. Il cancello di uscita del lotto (`cervello/cancello-lotto.mjs`) esisteva già ed era
# buono; non era agganciato al momento che conta. In questo repo NESSUN workflow girava su
# `pull_request` — l'unico era `deploy-pannello.yml`, su push a main — e il `pre-commit` locale gira
# solo sui commit che toccano `cantiere-difetti.json`. Per di più i hook sono configurazione locale:
# una sessione nuova può avere `core.hooksPath` non impostato e non se ne accorge nessuno (AR-343).
#
# L'effetto composto misurato il 29/7: la PR #604 è entrata su main con la propria prova rossa, e la
# #602 ha aggiunto un guardiano senza la sua riga di descrizione. Da quel momento il cancello era
# rosso su main PER TUTTI, e il rosso non era più attribuibile a chi l'aveva causato. Il registro del
# cantiere lo dice da sé: «un cancello sempre rosso viene aggirato al secondo giro, ed è peggio di
# non averlo».
#
# La radice non è nessuna delle due PR: è che la prova che protegge il lavoro non era agganciata al
# merge. Questo file la aggancia. Da qui in avanti un ramo con la suite rossa non arriva a main.
#
# COSA NON FA. Non mergia e non pubblica niente: legge, esegue le prove e dice sì o no. Il merge
# resta di Nicola (🟡 → la firma è sul merge), esattamente come prima.
#
# Nota per chi lo leggerà quando fallirà: `cancello-lotto.mjs` distingue tre esiti, e la differenza
# è il punto di tutto — 0 = si consegna · 1 = violazione vera · 2 = NON HO POTUTO MISURARE. Il 2 non
# è un verde: significa che una parte del controllo era cieca (dipendenze mancanti, file assente).
# Qui il 2 blocca come il racconto 1, apposta: un cancello che lascia passare ciò che non ha saputo
# misurare è la bugia che questo lotto cura.

# 🍰 IN FETTE, DAL 13/11 — Nicola: «fai in modo che le CI della macchina non superino i 2/3 minuti».
#
# MISURATO prima di toccare, richiesta 944, corsa 43340266076: un lavoro solo di 10 minuti e 20 s.
# Preparazione 1 minuto (checkout 12 s, npm ci 13 s, browser 38 s); dentro il cancello: guardiani
# 12 s, suite del cervello 364 s, mutazioni del lotto 104 s, typecheck 2 s, prove del Pannello 3 s.
# La suite misurata prova per prova il 13/11 (4 processori, 409 s): 278 di quei secondi sono 73 prove
# che girano UNA alla volta — scrivono sul dato vivo o accendono un browser — e su una macchina sola
# non c'è corsia che le acceleri.
#
# COSA CAMBIA: DOVE girano, non COSA gira. Ogni prova e ogni mutazione girano una volta, su una delle
# fette qui sotto, ognuna sul suo runner (cioè sul suo disco: le prove in fila non si pestano). Poi
# «prove, guardiani e typecheck» — lo stesso nome, lo stesso comando, gli stessi guardiani — ricuce i
# referti invece di rilanciare la suite (`--referti`), e controlla che OGNI prova della cartella e
# OGNI mutazione del perimetro abbiano il loro verdetto: una fetta che non consegna esce ⚪, e il ⚪
# qui blocca come il rosso. La regola sta in cervello/fette-ci.mjs, con le sue prove.
#
# E «suite del cervello + typecheck del Pannello», che prima rifaceva la stessa suite una seconda
# volta in `test-cervello.yml`, adesso legge le stesse fette: un verdetto in più, zero prove in meno.
# Il conto dei tempi, prima e dopo, sta nella richiesta che ha portato questo file (ci-tre-minuti).

name: Cancello del lotto

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Una PR aggiornata due volte di fila non deve tenere occupata la coda con la corsa vecchia.
concurrency:
  group: cancello-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── LE FETTE DELLA SUITE ─────────────────────────────────────────────────────────────────────
  # Quante: l'elenco qui sotto è l'UNICO posto dove si sceglie. Il comando legge l'indice e il totale
  # dalla matrice stessa (`strategy.job-index`, `strategy.job-total`): un numero scritto due volte —
  # nella matrice e nel comando — è il modo in cui un giorno una fetta resta fuori senza che nessuno
  # se ne accorga. Otto, perché la prova più lunga (lo schermo del Pannello, 53 s) è già un ottavo
  # della suite: con più fette la più lenta non scende, aumentano solo i runner occupati.
  suite:
    name: suite del cervello — fetta ${{ matrix.fetta }}
    runs-on: ubuntu-latest
    # Erano 20, e il cancello ne prendeva 6 e mezzo. Da quando c'è il browser il conto cambia: lo
    # scarico di chromium, la compilazione a freddo del Pannello e la mutazione di AR-613 che lo
    # riapre. Il margine sta qui apposta — un cancello ucciso dall'orologio è un ⚪, e chi legge un
    # lavoro bocciato dall'orologio impara a rilanciarlo invece di leggerlo.
    #
    # 🚧 AR-891 — 30 → 75 IL 31/8, e il numero non è a occhio.
    #
    # MISURATO: su questo ramo il cancello è partito TREDICI volte e tredici volte è finito
    # `cancelled`, mai una che desse un verdetto. Alcune corse sono durate esattamente trenta minuti
    # prima di morire, senza nessuna spinta nel mezzo: era l'orologio, non la coda.
    #
    # E la cosa che rende il difetto grave non è il tetto: è che GitHub segna un lavoro ucciso
    # dall'orologio come «annullato», non come «fallito». La suite dei controlli diceva «nessun
    # controllo è fallito» — vero alla lettera, e falso in sostanza, perché il cancello non aveva
    # controllato niente. Un guardiano che tace e il cui silenzio si legge come «tutto a posto» è
    # esattamente la malattia che questo lotto cura, applicata al guardiano di questo lotto.
    #
    # IL CONTO, perché il costo scala col LOTTO e non è una costante: il cancello rompe apposta ogni
    # mutazione del lotto e pretende il rosso. Questo lotto ne porta 52, e SETTE di quelle rilanciano
    # `due-case.test.mjs`, che da sola prende minuti. Solo le mutazioni valgono mezz'ora; più la
    # suite (535 secondi misurati a macchina libera), più npm ci, il browser e bats. Circa cinquanta
    # minuti di lavoro vero dentro un tetto di trenta.
    #
    # 75 è una volta e mezza il bisogno misurato. Non di più, e vale qui la stessa ragione scritta
    # accanto a TEMPO_MAX_SUITE in cervello/cancello-lotto.mjs: un tetto troppo generoso smette di
    # distinguere «la macchina è lenta» da «si è piantato».
    #
    # 🍰 Dal 13/11 il tetto vale per OGNI lavoro di questo flusso, non più per uno solo: ognuno fa
    # una parte del lavoro di prima, e nessun tetto si abbassa. Il tempo vero lo dice la corsa.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        fetta: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # Agganciate al commit, non all'etichetta (AR-637): un tag si sposta, un commit no.
      # Per aggiornarle: `git ls-remote --tags https://github.com/actions/checkout v4`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Il cancello confronta il ramo con main per sapere quali difetti il lotto TOCCA: con un
          # clone superficiale quel confronto degrada e lo dice («repo shallow»). Qui la storia serve,
          # e serve anche alle prove che chiedono a git cosa è cambiato negli ultimi giorni.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          # La cache dei pacchetti scaricati, non dei pacchetti installati: `npm ci` gira lo stesso
          # e installa esattamente il lockfile — cambia solo che non riscarica tutto da internet.
          cache: npm
          cache-dependency-path: pannello/package-lock.json

      # 🖥️ IL BROWSER — AR-707, 15/8.
      #
      # `cervello/test/c4-schermo-coda.test.mjs` non legge un file: apre il Pannello vero e guarda la
      # pagina costruita. Su una macchina senza browser fa la cosa giusta — dichiara di non aver
      # potuto guardare ed esce zero. Ma zero è anche il numero di chi ha guardato e non ha trovato
      # niente da ridire, e il banco delle mutazioni leggeva solo quel numero: sul referto usciva
      # «❌ AR-613 — la prova NON dimostra il suo fix». Falso. Quella prova diventa rossa eccome, su
      # una macchina che il Pannello lo sa aprire: era l'ambiente a mancare, non la difesa.
      #
      # Il banco adesso distingue ⚪ da ❌ (`verdettoCorsa`), ma un ⚪ resta un cancello rosso — ed è
      # giusto così: questo file lo dice due volte, un cieco non è un verde. Quindi la strada per il
      # verde è una sola, ed è la stessa già scritta qui sopra per `npm ci` e il typecheck: **la
      # copertura si guadagna installando lo strumento, non abbassando l'asticella.**
      #
      # Qui vale il doppio, perché non serve solo alla mutazione: senza browser quelle CINQUE prove
      # di accessibilità del Pannello — comandi annidati, ruoli delle linguette, spostamento da
      # tastiera, misura del pollice, tema scuro — non le eseguiva nessuno, né qui né in
      # `test-cervello.yml`. Passano da «provate su una postazione» a «provate a ogni richiesta».
      # Il Pannello NON si accende qui: se lo trova spento, se lo accende la prova stessa, e va bene
      # così. Accenderlo prima faceva risparmiare una compilazione, ma apriva una finestra in cui
      # sbagliare: la mutazione cambia il file mentre il server gira, e il server deve accorgersene
      # e ricompilare PRIMA che la prova guardi la pagina. Se arriva un attimo tardi, la prova vede
      # la pagina vecchia, resta verde, e il banco scrive di nuovo «AR-613 non prova niente» — cioè
      # la stessa accusa all'innocente che questo passo esiste per togliere, per un'altra strada.
      # Lasciando accendere la prova, la pagina si compila da zero col fix già rotto: niente finestra.
      #
      # Non servono chiavi: la coda che il Pannello disegna la legge dai file del vault, che stanno
      # in questo stesso commit. È per questo che la pagina ha delle card anche su una macchina dove
      # non esiste nessun Supabase — e senza card la prova direbbe «spariti anche i bottoni».
      # 🍰 La cartella dei browser si tiene fra una corsa e l'altra (centoquattro mega ogni volta, otto
      # fette): la chiave porta la versione, quindi un aggiornamento di playwright la rinnova da solo.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1-${{ runner.os }}

      # 🐚 CHI ESEGUE LE PROVE IN BASH — AR-693 ①. Ventinove prove esistevano e non le lanciava
      # nessuno: senza `bats` il banco le dichiara ⚪ e il verde di fianco vale meno di quanto sembra.
      # Una casa sola per tutti gli esecutori (CI, VPS, avvio di sessione): cervello/installa-bats.sh.
      #
      # 🍰 Le tre installazioni non dipendono l'una dall'altra, e in fila costavano 13 + 38 + 1 s a ogni
      # fetta: le prime due partono insieme, e il passo fallisce se una sola delle due fallisce.
      # Le dipendenze del Pannello restano PRIMA della suite (AR-696/AR-697: una prova sana che importa
      # `next` uscirebbe «import non risolvibile»), e `bats` resta la casa unica di sempre.
      - name: Dipendenze del Pannello, browser per le prove a schermo, chi esegue le prove in bash
        run: |
          npm --prefix pannello ci > "$RUNNER_TEMP/dipendenze.log" 2>&1 &
          dipendenze=$!
          # `playwright` finisce direttamente nel PATH globale: chiamarlo per nome toglie di mezzo
          # la domanda «npx sta usando quello installato o ne sta scaricando un altro?».
          ( npm i -g playwright@1.56.1 && playwright install --with-deps chromium ) > "$RUNNER_TEMP/browser.log" 2>&1 &
          browser=$!
          esito=0
          wait "$dipendenze" || { echo "::error::npm --prefix pannello ci non è andato a buon fine"; esito=1; }
          wait "$browser" || { echo "::error::il browser per le prove a schermo non si è installato"; esito=1; }
          cat "$RUNNER_TEMP/dipendenze.log" "$RUNNER_TEMP/browser.log"
          bash cervello/installa-bats.sh
          # `require("playwright")` deve risolversi da dentro il repo: il file di prova cerca anche
          # in NODE_PATH, e la radice globale è dove npm l'ha appena messo.
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          exit "$esito"

      - name: Fetta della suite del cervello
        env:
          INDICE: ${{ strategy.job-index }}
          TOTALE: ${{ strategy.job-total }}
        run: |
          mkdir -p referti
          node cervello/test-cervello.mjs --fetta "$((INDICE + 1))/$TOTALE" --referto "referti/suite-$((INDICE + 1)).json"

      # Anche se la fetta è rossa: il verdetto lo dà chi ricuce, e senza il referto non avrebbe niente
      # da leggere — un rosso diventerebbe un ⚪ e perderebbe il suo nome.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: suite-${{ matrix.fetta }}
          path: referti/
          if-no-files-found: warn
          retention-days: 3

  # ── LE FETTE DELLE MUTAZIONI DEL LOTTO ───────────────────────────────────────────────────────
  # La prova che le prove provino (AR-393): ogni mutazione del perimetro rompe un fix apposta e
  # pretende il rosso. Il perimetro lo calcola ogni fetta con la stessa funzione del cancello, poi
  # prova solo la sua parte; il cancello qui sotto lo ricalcola e conta che non ne manchi nessuna.
  # Quattro fette da quattro corsie: sedici difese provate insieme invece di quattro.
  mutazioni:
    name: mutazioni del lotto — fetta ${{ matrix.fetta }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        fetta: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pannello/package-lock.json

      # Il browser serve anche qui: la mutazione di AR-613 rompe il Pannello e pretende che lo schermo
      # se ne accorga — senza browser quella prova dichiara di non aver guardato (AR-707).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1-${{ runner.os }}

      - name: Dipendenze del Pannello, browser per le prove a schermo, chi esegue le prove in bash
        run: |
          npm --prefix pannello ci > "$RUNNER_TEMP/dipendenze.log" 2>&1 &
          dipendenze=$!
          ( npm i -g playwright@1.56.1 && playwright install --with-deps chromium ) > "$RUNNER_TEMP/browser.log" 2>&1 &
          browser=$!
          esito=0
          wait "$dipendenze" || { echo "::error::npm --prefix pannello ci non è andato a buon fine"; esito=1; }
          wait "$browser" || { echo "::error::il browser per le prove a schermo non si è installato"; esito=1; }
          cat "$RUNNER_TEMP/dipendenze.log" "$RUNNER_TEMP/browser.log"
          bash cervello/installa-bats.sh
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          exit "$esito"

      - name: Fetta delle mutazioni del lotto
        env:
          INDICE: ${{ strategy.job-index }}
          TOTALE: ${{ strategy.job-total }}
        run: |
          mkdir -p referti
          node cervello/cancello-lotto.mjs --fetta-mutazioni "$((INDICE + 1))/$TOTALE" --referto "referti/mutazioni-$((INDICE + 1)).json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutazioni-${{ matrix.fetta }}
          path: referti/
          if-no-files-found: warn
          retention-days: 3

  # ── IL CANCELLO ──────────────────────────────────────────────────────────────────────────────
  # Stesso nome di prima, apposta: se un giorno la protezione del ramo lo pretende, lo pretende per
  # nome. Gira anche se una fetta è rossa (`!cancelled()`): il verdetto con i tetti è il suo, e una
  # fetta rossa per un debito ereditato sotto il tetto non deve impedirgli di dirlo.
  cancello:
    name: prove, guardiani e typecheck
    needs: [suite, mutazioni]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pannello/package-lock.json

      # Il typecheck del Pannello è parte del cancello: senza le dipendenze uscirebbe 2 (cieco), e
      # cieco non è verde. Installarle qui è ciò che rende il verde un verde vero.
      - name: Dipendenze del Pannello e chi esegue le prove in bash
        run: |
          npm --prefix pannello ci
          bash cervello/installa-bats.sh

      # Se una fetta non ha caricato niente, lo scaricamento non deve fermare il cancello prima che
      # possa dirlo: è il cancello che nomina la fetta mancante e esce ⚪.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: suite-*
          merge-multiple: true
          path: referti/suite

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: mutazioni-*
          merge-multiple: true
          path: referti/mutazioni

      - name: Cancello di uscita
        run: node cervello/cancello-lotto.mjs --referti referti

  # ── LA SUITE INTERA, SENZA TETTI ─────────────────────────────────────────────────────────────
  # Il verdetto che dava `test-cervello.yml` sulle richieste: ogni rosso è rosso, nessun tetto. Prima
  # rilanciava la suite una seconda volta su un altro runner; adesso legge le stesse fette. Su main
  # (i push diretti dal VPS, AR-377) lo dà ancora `test-cervello.yml`, che lì è l'unico.
  suite-intera:
    name: suite del cervello + typecheck del Pannello
    needs: [suite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pannello/package-lock.json

      - name: Dipendenze del Pannello
        run: npm --prefix pannello ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: suite-*
          merge-multiple: true
          path: referti/suite

      - name: Suite del cervello, ricucita dalle fette
        run: node cervello/test-cervello.mjs --ricuci referti/suite

      - name: Typecheck del Pannello
        if: ${{ !cancelled() }}
        run: npx --prefix pannello tsc --noEmit --project pannello/tsconfig.json
